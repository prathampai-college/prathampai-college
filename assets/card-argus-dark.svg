<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 190" width="100%" height="190">
  <defs>
    <style>
      .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .tag { font-weight: 700; font-size: 10px; fill: #FF2A37; letter-spacing: 1.5px; }
      .title { font-weight: 800; font-size: 18px; fill: #FFFFFF; letter-spacing: 1px; }
      .desc { font-size: 11px; fill: #9CA3AF; line-height: 1.4; }
      .badge-text { font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="430" height="190" fill="#0D1117" rx="6" stroke="#30363D" stroke-width="1.2" />
  <rect x="0" y="0" width="430" height="3" fill="#38BDF8" rx="0" />

  <!-- Top Category Tag -->
  <text x="20" y="26" class="mono tag" fill="#38BDF8">03 // TYPESCRIPT &#183; BUN &#183; WAL</text>

  <!-- Title -->
  <text x="20" y="52" class="sans title">ARGUS</text>
  <text x="100" y="51" class="mono" font-size="11" fill="#6B7280">// MULTI-CHAIN PIPELINE</text>

  <!-- Feature bullets -->
  <text x="20" y="76" class="sans desc">&#8226; Multi-chain WebSocket normalization &#8594; SQLite WAL facts</text>
  <text x="20" y="96" class="sans desc">&#8226; Reorg-safe union-find graph: every mutation records undo</text>
  <text x="20" y="116" class="sans desc">&#8226; HMAC-signed webhooks &#183; SSRF hardened redirect rejection</text>

  <!-- Tech Pills -->
  <rect x="20" y="136" width="80" height="22" rx="3" fill="#1F2937" stroke="#38BDF8" stroke-width="1" />
  <text x="27" y="151" class="mono badge-text" fill="#BAE6FD">TypeScript</text>

  <rect x="106" y="136" width="50" height="22" rx="3" fill="#1F2937" stroke="#F59E0B" stroke-width="1" />
  <text x="113" y="151" class="mono badge-text" fill="#FDE68A">Bun</text>

  <rect x="162" y="136" width="82" height="22" rx="3" fill="#1F2937" stroke="#10B981" stroke-width="1" />
  <text x="169" y="151" class="mono badge-text" fill="#A7F3D0">WebSockets</text>

  <rect x="250" y="136" width="52" height="22" rx="3" fill="#1F2937" stroke="#E30613" stroke-width="1" />
  <text x="257" y="151" class="mono badge-text" fill="#FCA5A5">viem</text>

  <!-- Action Footer -->
  <text x="20" y="176" class="mono" font-size="10.5" font-weight="700" fill="#9CA3AF">STATUS // PRIVATE PIPELINE &#183; DOCS ON REQUEST</text>
</svg>
