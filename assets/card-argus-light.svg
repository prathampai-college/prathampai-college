<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 190" width="100%" height="190">
  <defs>
    <style>
      .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .tag { font-weight: 700; font-size: 10px; fill: #0284C7; letter-spacing: 1.5px; }
      .title { font-weight: 800; font-size: 18px; fill: #0A0A0A; letter-spacing: 1px; }
      .desc { font-size: 11px; fill: #52525B; line-height: 1.4; }
      .badge-text { font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="430" height="190" fill="#FFFCF8" rx="6" stroke="#E7E5E4" stroke-width="1.2" />
  <rect x="0" y="0" width="430" height="3" fill="#0284C7" rx="0" />

  <!-- Top Category Tag -->
  <text x="20" y="26" class="mono tag">03 // TYPESCRIPT &#183; BUN &#183; WAL</text>

  <!-- Title -->
  <text x="20" y="52" class="sans title">ARGUS</text>
  <text x="100" y="51" class="mono" font-size="11" fill="#71717A">// MULTI-CHAIN PIPELINE</text>

  <!-- Feature bullets -->
  <text x="20" y="76" class="sans desc">&#8226; Multi-chain WebSocket normalization &#8594; SQLite WAL facts</text>
  <text x="20" y="96" class="sans desc">&#8226; Reorg-safe union-find graph: every mutation records undo</text>
  <text x="20" y="116" class="sans desc">&#8226; HMAC-signed webhooks &#183; SSRF hardened redirect rejection</text>

  <!-- Tech Pills -->
  <rect x="20" y="136" width="80" height="22" rx="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1" />
  <text x="27" y="151" class="mono badge-text" fill="#075985">TypeScript</text>

  <rect x="106" y="136" width="50" height="22" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1" />
  <text x="113" y="151" class="mono badge-text" fill="#92400E">Bun</text>

  <rect x="162" y="136" width="82" height="22" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1" />
  <text x="169" y="151" class="mono badge-text" fill="#065F46">WebSockets</text>

  <rect x="250" y="136" width="52" height="22" rx="3" fill="#FEF2F2" stroke="#E30613" stroke-width="1" />
  <text x="257" y="151" class="mono badge-text" fill="#991B1B">viem</text>

  <!-- Action Footer -->
  <text x="20" y="176" class="mono" font-size="10.5" font-weight="700" fill="#52525B">STATUS // PRIVATE PIPELINE &#183; DOCS ON REQUEST</text>
</svg>
