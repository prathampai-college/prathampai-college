  <rect x="92" y="136" width="86" height="22" rx="3" fill="#1F2937" stroke="#10B981" stroke-width="1" />
  <text x="99" y="151" class="mono badge-text" fill="#A7F3D0">Zero Lookahead</text>

  <rect x="184" y="136" width="70" height="22" rx="3" fill="#1F2937" stroke="#E30613" stroke-width="1" />
  <text x="191" y="151" class="mono badge-text" fill="#FCA5A5">16 Modules</text>

  <rect x="260" y="136" width="70" height="22" rx="3" fill="#1F2937" stroke="#F59E0B" stroke-width="1" />
  <text x="267" y="151" class="mono badge-text" fill="#FDE68A">Pydantic</text>

  <!-- Action Footer -->
  <text x="20" y="176" class="mono" font-size="10.5" font-weight="700" fill="#FF2A37">VIEW ON GITHUB &#8599;</text>
