<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 190" width="100%" height="190">
  <defs>
    <style>
      .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .tag { font-weight: 700; font-size: 10px; fill: #E30613; letter-spacing: 1.5px; }
      .title { font-weight: 800; font-size: 18px; fill: #0A0A0A; letter-spacing: 1px; }
      .desc { font-size: 11px; fill: #52525B; line-height: 1.4; }
      .badge-text { font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="430" height="190" fill="#FFFCF8" rx="6" stroke="#E7E5E4" stroke-width="1.2" />
  <rect x="0" y="0" width="430" height="3" fill="#E30613" rx="0" />

  <!-- Top Category Tag -->
  <text x="20" y="26" class="mono tag">01 // RUST &#183; TYPESCRIPT &#183; GEYSER</text>

  <!-- Title -->
  <text x="20" y="52" class="sans title">VELOCI-BUY</text>
  <text x="145" y="51" class="mono" font-size="11" fill="#71717A">// SOLANA DISCOVERY ENGINE</text>

  <!-- Feature bullets -->
  <text x="20" y="76" class="sans desc">&#8226; Native Rust &#8596; Node FFI via napi-rs: LSTM+PPO core, zero overhead</text>
  <text x="20" y="96" class="sans desc">&#8226; 9,216-combo hyperparameter grid &#183; chronological time-splits</text>
  <text x="20" y="116" class="sans desc">&#8226; Custom Geyser plugin (Rust) &#183; zero-copy binary decode ahead of RPC</text>

  <!-- Tech Pills -->
  <rect x="20" y="136" width="68" height="22" rx="3" fill="#FEF2F2" stroke="#E30613" stroke-width="1" />
  <text x="27" y="151" class="mono badge-text" fill="#991B1B">Rust FFI</text>

  <rect x="94" y="136" width="76" height="22" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1" />
  <text x="101" y="151" class="mono badge-text" fill="#92400E">LSTM+PPO</text>

  <rect x="176" y="136" width="88" height="22" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1" />
  <text x="183" y="151" class="mono badge-text" fill="#065F46">Geyser Plugin</text>

  <rect x="270" y="136" width="70" height="22" rx="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1" />
  <text x="277" y="151" class="mono badge-text" fill="#075985">SQLite WAL</text>

  <!-- Action Footer -->
  <text x="20" y="176" class="mono" font-size="10.5" font-weight="700" fill="#E30613">VIEW ON GITHUB &#8599;</text>
</svg>
