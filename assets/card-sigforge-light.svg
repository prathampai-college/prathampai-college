  <text x="27" y="151" class="mono badge-text" fill="#075985">Python</text>

  <rect x="92" y="136" width="86" height="22" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="1" />
  <text x="99" y="151" class="mono badge-text" fill="#065F46">Zero Lookahead</text>

  <rect x="184" y="136" width="70" height="22" rx="3" fill="#FEF2F2" stroke="#E30613" stroke-width="1" />
  <text x="191" y="151" class="mono badge-text" fill="#991B1B">16 Modules</text>

  <rect x="260" y="136" width="70" height="22" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="1" />
  <text x="267" y="151" class="mono badge-text" fill="#92400E">Pydantic</text>

  <!-- Action Footer -->
  <text x="20" y="176" class="mono" font-size="10.5" font-weight="700" fill="#E30613">VIEW ON GITHUB &#8599;</text>
