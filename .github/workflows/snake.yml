name: Generate Contribution Snake

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23E30613&color_dots=%23FFFCF8,%23E7E5E4,%23A1A1AA,%2352525B,%230A0A0A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23E30613&color_dots=%231C1C1C,%232A2A2A,%2352525B,%23A1A1AA,%23FFFCF8

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.5.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}